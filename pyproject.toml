[project]
name = "anythingtoanything"
version = "0.1.0"
description = "A private-by-default document converter with local browser conversion and a Python backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.22,<1",
  "pypandoc-binary>=1.15,<2",
  "pypdf>=6.9,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2",
  "Pillow>=12.2,<13",
  "reportlab>=4.4,<5",
  "pdf2docx>=0.5.13,<0.6",
  "pymupdf>=1.26.7,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
browser = ["playwright>=1.55,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
