name: Quality Gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-unit:
    name: Browser conversion tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  python:
    name: Python conversion & OCR tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install conversion engines and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Check Python syntax
        run: uv run python -m compileall -q app tests
      - name: Run regression tests
        run: uv run pytest -q tests/test_conversion.py tests/test_ocr.py tests/test_pdf_word.py tests/test_pdf_precise.py
